[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vam"
version = "0.1.0"
readme = "README.md"
license = {file = "LICENSE"}
description = "Variational Action Machine: present-state Dirac-Zurek density machine built from the owner's specification in spec/"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "sympy>=1.13"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]
fast = ["numba>=0.61"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running checks"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "PERF", "PLR0133"]
ignore = ["E731", "E741", "RUF001", "RUF002", "RUF003", "PERF401"]   # lambdas and math symbols (I, rho, ...) are the notation of the spec

[tool.ruff.lint.isort]
known-first-party = ["vam"]
